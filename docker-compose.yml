version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: claims_postgres
    environment:
      POSTGRES_USER: claimuser
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claimsdb
    ports:
      - "5432:5432"
    volumes:
      - claims_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimuser -d claimsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: claims_backend
    environment:
      DATABASE_URL: postgresql://claimuser:claimpass@postgres:5432/claimsdb
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: claims_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  claims_pgdata:
