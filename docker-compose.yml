version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: claims_postgres
    environment:
      POSTGRES_USER: claimuser
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claimsdb
    ports:
      - "5432:5432"
    volumes:
      - claims_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  claims_pgdata:
